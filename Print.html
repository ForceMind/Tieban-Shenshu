<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F3EC">
  <title>铁板神数 · 完整报告</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    /* ---------- 页面特有样式（其余复用 css/app.css v2） ---------- */
    .app { max-width: 900px; }

    /* 报告版：参数卡不做点击交互 */
    .stat { cursor: default; }

    /* 报告版：流年卡始终展开 */
    .year-card__summary { cursor: default; }
    .year-card__detail { display: block; }

    /* 名词白话对照：释义左对齐、可读性 */
    .gloss-title {
      font-size: 13px; font-weight: 700; color: var(--ink-2);
      margin: 16px 0 4px; padding-top: 12px; border-top: 1px dashed var(--line-strong);
    }
    .gloss .kv__k { font-weight: 600; color: var(--ink); min-width: 5em; }
    .gloss .kv__v { text-align: left; color: var(--ink-2); font-size: 13px; line-height: 1.7; }

    .placeholder { text-align: center; color: var(--ink-3); font-size: 14px; padding: 22px 8px; line-height: 1.7; }
    .placeholder small { display: block; font-size: 12px; margin-top: 8px; }

    .section-title { font-size: 16px; font-weight: 700; margin: 20px 4px 8px; }

    /* 宽屏下参数格三列更紧凑 */
    @media (min-width: 700px) {
      .stat-grid { grid-template-columns: repeat(3, 1fr); }
    }

    /* ---------- 打印精修 ---------- */
    @page { size: A4; margin: 12mm; }
    @media print {
      .no-print { display: none !important; }
      body { font-size: 11px; background: #fff; }
      .app { max-width: none; padding: 0; }
      .card, .year-card, .tw, .stat, .duanyu-item { break-inside: avoid; }
      .card, .year-card, .brand__seal { box-shadow: none; }
      .stat-grid { grid-template-columns: repeat(4, 1fr); }
      .vernacular, .tw--main {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="brand">
      <div class="brand__seal">铁</div>
      <div>
        <div class="brand__name">铁板神数</div>
        <div class="brand__tag">先天考刻 · 完整报告</div>
      </div>
    </div>

    <div class="actions no-print">
      <button type="button" class="btn btn--primary" id="btnPrint">打印报告</button>
      <button type="button" class="btn btn--ghost" id="btnBack">返回重排</button>
    </div>

    <div id="root">
      <div class="loading">
        <div class="spinner"></div>
        <div>正在生成完整报告…</div>
      </div>
    </div>

    <div class="foot no-print">仅供传统文化研习与娱乐，不构成任何决策依据。</div>
  </div>

  <script src="js/terms.js"></script>
  <script src="js/duanyu-modern.js"></script>
  <script>
    // ---------- 工具 ----------
    function esc(v) { return (v === null || v === undefined) ? '' : v; }

    function modernOf(t) {
      if (!t || t === '未找到断语' || t === '—') return '';
      return (window.DUANYU_MODERN || {})[t] || '';
    }
    function vernacularHtml(t) {
      var m = modernOf(t);
      return m ? '<div class="vernacular">' + m + '</div>' : '';
    }

    function termShort(name) {
      var t = (window.TIEBAN_TERMS || {})[name];
      return (t && t.short) || '';
    }
    function termDetail(name) {
      var t = (window.TIEBAN_TERMS || {})[name];
      return (t && t.detail) || '';
    }

    // ---------- 卦象映射 ----------
    var guaMap = {
      "乾": { lines: "☰", element: "金" },
      "坤": { lines: "☷", element: "土" },
      "震": { lines: "☳", element: "木" },
      "巽": { lines: "☴", element: "木" },
      "坎": { lines: "☵", element: "水" },
      "离": { lines: "☲", element: "火" },
      "艮": { lines: "☶", element: "土" },
      "兑": { lines: "☱", element: "金" }
    };
    var twelveHexMap = {
      "乾": { shang: "乾", xia: "乾" },
      "夬": { shang: "兑", xia: "乾" },
      "大壮": { shang: "震", xia: "乾" },
      "泰": { shang: "坤", xia: "乾" },
      "临": { shang: "坤", xia: "兑" },
      "复": { shang: "坤", xia: "震" },
      "坤": { shang: "坤", xia: "坤" },
      "剥": { shang: "艮", xia: "坤" },
      "观": { shang: "巽", xia: "坤" },
      "否": { shang: "乾", xia: "坤" },
      "遁": { shang: "乾", xia: "艮" },
      "姤": { shang: "乾", xia: "巽" }
    };

    // ---------- 输入信息 ----------
    function renderInfo(data) {
      var b = data.info_b || {};
      var q = data.info_q || {};
      var bz = b.bazi || {};
      var qz = q.bazi || {};
      var rows = [
        ['性别', esc(data.gender)],
        ['出生（公历）', esc(b.date_str)],
        ['农历', esc(b.lunar_str)],
        ['闰月', b.is_leap ? '是' : '否'],
        ['出生八字', [bz.year, bz.month, bz.day, bz.time].map(esc).join(' ')],
        ['求测（公历）', esc(q.date_str)],
        ['求测八字', [qz.year, qz.month, qz.day, qz.time].map(esc).join(' ')]
      ];
      var html = '<div class="card"><div class="card__title">输入信息</div>';
      rows.forEach(function (r) {
        html += '<div class="kv"><span class="kv__k">' + r[0] + '</span><span class="kv__v">' + r[1] + '</span></div>';
      });
      html += '</div>';
      return html;
    }

    // ---------- 基础排盘 ----------
    function renderBasic(result) {
      var dlc = result.day_life_calc || '';
      var dayM = dlc.match(/日命:(\d+)/);
      var timeM = dlc.match(/时运:(\d+)/);
      var dayLife = dayM ? dayM[1] : '—';
      var timeLuck = timeM ? timeM[1] : '—';

      var usedTerms = [];

      function stat(name, value, accent) {
        usedTerms.push(name);
        var vClass = 'stat__value' + (accent ? ' stat__value--accent' : '');
        var h = '<div class="stat"><div class="stat__label">' + name + '</div>';
        h += '<div class="' + vClass + '">' + esc(value) + '</div>';
        var s = termShort(name);
        if (s) h += '<div class="stat__note">' + s + '</div>';
        h += '</div>';
        return h;
      }

      var html = '<div class="card"><div class="card__title">基础排盘 <small>每项附一句白话微注</small></div><div class="stat-grid">';
      html += stat('先天命数', result.cong_num);
      html += stat('五音命数', result.tone_num);
      html += stat('日命数', dayLife);
      html += stat('时运数', timeLuck);
      html += stat('刻别', result.moment_cn);
      html += stat('本命数', result.main_num);
      html += stat('十二辟卦', result.hex_name, true);
      html += stat('后天命数', result.pn_num);
      if (result.san_yuan) html += stat('三元九运', result.san_yuan);
      html += stat('终局条文数', result.final_fortune_num, true);

      // 五数寄宫（宽）
      if (result.wu_shu_ji_gong) {
        usedTerms.push('五数寄宫');
        var w = result.wu_shu_ji_gong;
        html += '<div class="stat stat--wide"><div class="stat__label">五数寄宫</div>';
        html += '<div class="stat__value" style="font-size:16px;">' +
          esc(w.original) + ' → ' + esc(w['寄宫卦']) + ' → ' + esc(w['实际命数']) + '</div>';
        html += '<div class="stat__note">' + termShort('五数寄宫') +
          (w['依据'] ? ' ｜ 依据：' + esc(w['依据']) : '') + '</div>';
        html += '</div>';
      }

      // 八卦加则（宽）
      if (result.bagua_jiaze) {
        usedTerms.push('八卦加则');
        var j = result.bagua_jiaze;
        html += '<div class="stat stat--wide"><div class="stat__label">八卦加则</div>';
        html += '<div class="stat__value" style="font-size:16px;">' +
          esc(j['卦名']) + ' ｜ 起始 ' + esc(j['起始数']) + '</div>';
        html += '<div class="stat__note">' + termShort('八卦加则') +
          (j['规则'] ? ' ｜ ' + esc(j['规则']) : '') + '</div>';
        html += '</div>';
      }

      html += '</div>'; // stat-grid

      // 名词白话对照（供打印读者查全称解释）
      html += '<div class="gloss-title">名词白话对照</div><div class="gloss">';
      usedTerms.forEach(function (name) {
        var d = termDetail(name);
        if (!d) return;
        html += '<div class="kv"><span class="kv__k">' + name + '</span>' +
          '<span class="kv__v">' + d + '</span></div>';
      });
      html += '</div>';

      html += '</div>'; // card
      return html;
    }

    // ---------- 卦象 ----------
    function renderGua(hexName) {
      hexName = hexName || '';
      var shangName = '乾', xiaName = '坤';
      if (twelveHexMap[hexName]) {
        shangName = twelveHexMap[hexName].shang;
        xiaName = twelveHexMap[hexName].xia;
      } else {
        for (var name in guaMap) {
          if (hexName.indexOf(name) === 0) shangName = name;
          if (hexName.length >= name.length && hexName.lastIndexOf(name) === hexName.length - name.length) xiaName = name;
        }
      }
      var sg = guaMap[shangName] || guaMap['乾'];
      var xg = guaMap[xiaName] || guaMap['坤'];

      var html = '<div class="card"><div class="card__title">卦象 <small>' + termShort('卦象') + '</small></div><div class="gua">';
      html += '<div class="gua__col"><div class="gua__glyph">' + sg.lines + '</div>' +
        '<div class="gua__name">' + shangName + '</div><div class="gua__tag">上卦 · ' + sg.element + '</div></div>';
      html += '<div class="gua__col gua__main"><div class="gua__glyph" style="opacity:.35;">☯</div>' +
        '<div class="gua__name">' + esc(hexName) + '</div><div class="gua__tag">本卦</div></div>';
      html += '<div class="gua__col"><div class="gua__glyph">' + xg.lines + '</div>' +
        '<div class="gua__name">' + xiaName + '</div><div class="gua__tag">下卦 · ' + xg.element + '</div></div>';
      html += '</div></div>';
      return html;
    }

    // ---------- 本命条文 ----------
    function renderDestiny(result) {
      var tbl = result.tbl_data;
      var html = '<div class="card"><div class="card__title">本命条文</div>';

      if (!tbl || !tbl.offsets) {
        html += '<div class="placeholder">暂无本命条文数据' +
          '<small>十二辟卦：' + esc(result.hex_name) + ' ｜ 刻别：' + esc(result.moment_cn) +
          ' ｜ 先天命数：' + esc(result.cong_num) + '</small>' +
          '<small>注：并非所有命数组合都有对应的本命条文记录</small></div></div>';
        return html;
      }

      var categories = ['性格', '才能前程', '财运', '兄弟个数'];
      var base = tbl.base || 0, seq = tbl.seq || 0;
      var hasData = false;

      categories.forEach(function (cat) {
        var offsets = (tbl.offsets && tbl.offsets[cat]) || [];
        var duanyus = (tbl.duanyus && tbl.duanyus[cat]) || [];
        if (!offsets.length) return;
        hasData = true;
        offsets.forEach(function (off, idx) {
          var fortune = base + seq + off;
          var info = duanyus[idx] || {};
          var duanyu = info.duanyu || '未找到断语';
          html += '<div class="duanyu-item">';
          html += '<div class="duanyu-item__head"><span class="duanyu-item__cat">' + cat + '</span>' +
            '<span class="duanyu-item__num">条文 ' + fortune + '</span></div>';
          html += '<div class="duanyu-item__text">' + duanyu + '</div>';
          html += vernacularHtml(duanyu);
          html += '</div>';
        });
      });

      if (!hasData) html += '<div class="placeholder">本命条文各属性暂无偏移数据</div>';
      html += '</div>';
      return html;
    }

    // ---------- 流年 ----------
    function truncate(s, n) {
      s = s || '';
      return s.length > n ? s.slice(0, n) + '…' : s;
    }

    function twBlock(label, num, text, isMain) {
      text = text || '未找到断语';
      var cls = 'tw' + (isMain ? ' tw--main' : '');
      var h = '<div class="' + cls + '">';
      h += '<div class="tw__label">' + label +
        (isMain ? '<span class="tw__badge">主判读</span>' : '') +
        (num !== undefined && num !== null && num !== '' ? '<span class="tw__num">条文 ' + num + '</span>' : '') +
        '</div>';
      h += '<div class="tw__text">' + text + '</div>';
      h += vernacularHtml(text);
      h += '</div>';
      return h;
    }

    function metaChips(item) {
      var chips = [];
      if (item.sound) chips.push('五音 ' + item.sound);
      if (item.marker) chips.push('标记 ' + item.marker);
      if (item.letter) chips.push('字母 ' + item.letter);
      if (item.corrected_correction !== undefined && item.corrected_correction !== null && item.corrected_correction !== '')
        chips.push('校正数 ' + item.corrected_correction);
      if (item.jiaze_result) chips.push('八卦加则 ' + item.jiaze_result);
      if (!chips.length) return '';
      var h = '<div class="tw__meta">';
      chips.forEach(function (c) { h += '<span class="chip">' + c + '</span>'; });
      h += '</div>';
      return h;
    }

    function renderHowto() {
      return '<div class="howto">' +
        '<b>三种条文怎么看？</b>每一岁给出三层判读：' +
        '「原条文」（' + termShort('原条文') + '）——' + termDetail('原条文') +
        '<b>「校正后条文」是主判读，一般以它为准</b>——' + termDetail('校正后条文') +
        '「铁板公式」（' + termShort('铁板公式') + '）——' + termDetail('铁板公式') +
        '</div>';
    }

    function renderLiunian(liunian, birthYear) {
      var html = '<div class="section-title">流年条文 · 1—108 岁</div>';
      html += renderHowto();

      if (!liunian || !liunian.length) {
        html += '<div class="card"><div class="placeholder">暂无流年数据</div></div>';
        return html;
      }

      html += '<div class="year-list">';
      liunian.forEach(function (item) {
        var age = item.age || '';
        var gYear = (birthYear && age) ? (birthYear + age - 1) : '';
        var lead = truncate(item.corrected_duanyu || item.original_duanyu || '', 34);

        html += '<div class="year-card">';

        // summary（岁 / 公历年 / 干支 / 主断语）
        html += '<div class="year-card__summary">';
        html += '<div class="year-card__age"><b>' + age + '岁</b><span>' + gYear + '</span></div>';
        html += '<div class="year-card__gz">' + esc(item.year) + '</div>';
        html += '<div class="year-card__lead">' + (lead || '—') + '</div>';
        html += '</div>';

        // detail（报告版始终展开）
        html += '<div class="year-card__detail">';
        html += twBlock('原条文', item.original_fortune, item.original_duanyu, false);
        html += twBlock('校正后条文', item.corrected_fortune, item.corrected_duanyu, true);
        html += twBlock('铁板公式', item.tieban_fortune, item.tieban_duanyu, false);
        html += metaChips(item);
        html += '</div>';

        html += '</div>'; // year-card
      });
      html += '</div>'; // year-list

      return html;
    }

    // ---------- 错误 ----------
    function renderError(msg) {
      document.getElementById('root').innerHTML =
        '<div class="card"><div class="placeholder" style="color:var(--cinnabar);">报告生成失败' +
        '<small>' + esc(msg) + '</small></div>' +
        '<button class="btn btn--primary" onclick="location.href=\'index.html\'">返回首页</button></div>';
    }

    // ---------- 入口 ----------
    (function init() {
      document.getElementById('btnPrint').addEventListener('click', function () { window.print(); });
      document.getElementById('btnBack').addEventListener('click', function () { location.href = 'index.html'; });

      var resultStr = localStorage.getItem('tiebanshushu_result');
      if (!resultStr) { location.href = 'index.html'; return; }

      var data;
      try { data = JSON.parse(resultStr); }
      catch (e) { renderError('数据解析失败'); return; }

      if (!data || !data.success) { renderError((data && data.error) || '未知错误'); return; }

      var result = data.result || {};
      var birthYear = parseInt((data.info_b && data.info_b.date_str) || '', 10) || 0;

      var html = '';
      html += renderInfo(data);
      html += renderBasic(result);
      html += renderGua(result.hex_name);
      html += renderDestiny(result);
      html += renderLiunian(result.liunian, birthYear);

      document.getElementById('root').innerHTML = html;
    })();
  </script>
</body>
</html>
