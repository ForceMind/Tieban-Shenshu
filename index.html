<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F3EC">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>铁板神数 · 先天考刻推演</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    .intro { font-size: 13px; color: var(--ink-2); line-height: 1.7; margin: 2px 4px 14px; }
    .err {
      display: none; margin: 12px 0 0; padding: 11px 14px; border-radius: var(--radius-sm);
      background: var(--cinnabar-soft); border: 1px solid rgba(181, 68, 52, .35);
      color: var(--cinnabar); font-size: 14px; text-align: center;
    }
    .overlay {
      position: fixed; inset: 0; background: rgba(246, 243, 236, .88); backdrop-filter: blur(3px);
      display: none; align-items: center; justify-content: center; z-index: 20;
    }
    .overlay.is-on { display: flex; }
  </style>
</head>
<body>
  <div class="app">
    <div class="brand">
      <div class="brand__seal">铁</div>
      <div>
        <div class="brand__name">铁板神数</div>
        <div class="brand__tag">先天考刻推演</div>
      </div>
    </div>
    <p class="intro">输入出生时间，推演先天命数、本命卦与 1–108 岁流年条文，所有断语附现代白话解释。数据仅在本机计算，不上传。</p>

    <form id="mainForm" novalidate>
      <div class="card">
        <div class="card__title">基本信息</div>

        <div class="field">
          <label class="field__label">性别</label>
          <div class="segmented" id="genderSeg" role="group" aria-label="性别">
            <button type="button" class="segmented__opt is-active" data-gender="男">男</button>
            <button type="button" class="segmented__opt" data-gender="女">女</button>
          </div>
        </div>

        <div class="field">
          <label class="field__label">出生时间（公历）</label>
          <div class="field__row">
            <input class="input" type="date" id="birthDate" min="1864-01-01" max="2043-12-31" required>
            <input class="input" type="time" id="birthTime" required>
          </div>
          <p class="field__hint">请精确到分钟——两小时分为八刻，出生落在哪一刻会直接影响推演结果。</p>
        </div>
      </div>

      <div class="card">
        <div class="card__title">求测时间 <small>默认当前，一般无需修改</small></div>
        <div class="field__row">
          <input class="input" type="date" id="queryDate" required>
          <input class="input" type="time" id="queryTime" required>
        </div>
      </div>

      <button class="btn btn--primary" type="submit">开始推演</button>
      <div class="err" id="err"></div>
    </form>

    <div class="foot">仅供传统文化研习与娱乐，不构成任何决策依据。</div>
  </div>

  <div class="overlay" id="overlay">
    <div class="loading">
      <div class="spinner"></div>
      <div>正在推演…</div>
    </div>
  </div>

  <script src="js/lunar.js"></script>
  <script src="js/db-data.js"></script>
  <script src="js/tieban.js"></script>
  <script>
    var selectedGender = "男";
    function pad2(n) { return (n < 10 ? "0" : "") + n; }
    function $(id) { return document.getElementById(id); }

    $("genderSeg").addEventListener("click", function (e) {
      var b = e.target.closest(".segmented__opt");
      if (!b) return;
      selectedGender = b.dataset.gender;
      this.querySelectorAll(".segmented__opt").forEach(function (o) { o.classList.toggle("is-active", o === b); });
    });

    (function initDefaults() {
      var now = new Date();
      $("birthDate").value = "1990-05-15";
      $("birthTime").value = "14:30";
      $("queryDate").value = now.getFullYear() + "-" + pad2(now.getMonth() + 1) + "-" + pad2(now.getDate());
      $("queryTime").value = pad2(now.getHours()) + ":" + pad2(now.getMinutes());
      restoreForm();
    })();

    function restoreForm() {
      try {
        var saved = JSON.parse(localStorage.getItem("tiebanshushu_form") || "null");
        if (!saved) return;
        if (saved.gender) {
          selectedGender = saved.gender;
          $("genderSeg").querySelectorAll(".segmented__opt").forEach(function (o) {
            o.classList.toggle("is-active", o.dataset.gender === saved.gender);
          });
        }
        if (saved.birth) {
          $("birthDate").value = saved.birth.year + "-" + pad2(saved.birth.month) + "-" + pad2(saved.birth.day);
          $("birthTime").value = pad2(saved.birth.hour) + ":" + pad2(saved.birth.minute);
        }
        if (saved.query) {
          $("queryDate").value = saved.query.year + "-" + pad2(saved.query.month) + "-" + pad2(saved.query.day);
          $("queryTime").value = pad2(saved.query.hour) + ":" + pad2(saved.query.minute);
        }
      } catch (e) { /* ignore */ }
    }

    function parseDT(dateVal, timeVal) {
      if (!dateVal || !timeVal) return null;
      var d = dateVal.split("-"), t = timeVal.split(":");
      return { year: +d[0], month: +d[1], day: +d[2], hour: +t[0], minute: +t[1] };
    }

    function showErr(msg) {
      var e = $("err"); e.textContent = msg; e.style.display = "block";
      setTimeout(function () { e.style.display = "none"; }, 5000);
    }

    var submitting = false;
    $("mainForm").addEventListener("submit", function (e) {
      e.preventDefault();
      if (submitting) return;
      var birth = parseDT($("birthDate").value, $("birthTime").value);
      var query = parseDT($("queryDate").value, $("queryTime").value);
      if (!birth) { showErr("请填写完整的出生日期与时间"); return; }
      if (!query) { showErr("请填写完整的求测日期与时间"); return; }

      submitting = true;
      $("overlay").classList.add("is-on");
      try {
        var formData = { gender: selectedGender, birth: birth, query: query };
        var res = window.calculateTieban(formData);
        if (!res || !res.success) throw new Error((res && res.error) || "计算失败");
        localStorage.setItem("tiebanshushu_form", JSON.stringify(formData));
        localStorage.setItem("tiebanshushu_result", JSON.stringify(res));
        setTimeout(function () { location.href = "result.html"; }, 120);
      } catch (err) {
        submitting = false;
        $("overlay").classList.remove("is-on");
        showErr("排盘失败：" + (err && err.message ? err.message : err));
      }
    });
  </script>
</body>
</html>
